user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server_tokens off;

    # Never generate directory listings (explicit for auditability).
    autoindex off;

    client_max_body_size 8m;
    client_body_timeout 12s;
    client_header_timeout 12s;

    map $request_uri $blocked_uri {
        default 0;
        ~(?i)(union\s+select|select\s+.*\s+from|insert\s+into|update\s+.*\s+set|drop\s+table|delete\s+from|<script|javascript:|onerror\s*=|\.\./\.\./|/etc/passwd|cmd=|eval\s*\(|exec\s*\(|system\s*\() 1;
        # Scanner/compromise probe paths.
        ~(?i)(\.git|\.env|\.svn|\.htaccess|\.bak|\.sql$|\.log$|wp-admin|wp-login|phpmyadmin|\.aws/|\.ssh/) 1;
    }

    map $http_user_agent $bad_bot {
        default 0;
        "" 1;
        ~*(semrushbot|ahrefsbot|mj12bot|dotbot|petalbot|bytespider|dataforseo|serpstatbot|scrapy|python-requests|python-urllib|go-http-client|java/|httpclient|libwww|wget|curl|zgrab|nmap|masscan) 1;
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_status 429;

    server {
        listen 80;
        listen [::]:80;
        server_name pasteldemiolos.xyz;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name pasteldemiolos.xyz;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header X-XSS-Protection "0" always;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://open.spotify.com https://www.youtube.com https://www.youtube-nocookie.com https://steamcommunity.com; frame-ancestors 'none'; upgrade-insecure-requests;" always;

        if ($blocked_uri) {
            return 403;
        }
        if ($bad_bot) {
            return 403;
        }

        location / {
            limit_req zone=general burst=60 nodelay;
            proxy_pass http://web:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            # Do not forward a client-supplied chain: the API trusts one proxy
            # hop when deriving IP-based rate-limit keys.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /robots.txt {
            proxy_pass http://web:80;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location = /sitemap.xml {
            proxy_pass http://web:80;
            add_header Cache-Control "public, max-age=86400" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        }

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://api:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            # Never cache authenticated API responses.
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        }

        location /assets/uploads/ {
            proxy_pass http://api:4000/assets/uploads/;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self'" always;
        }
    }
}
