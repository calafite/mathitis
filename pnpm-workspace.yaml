packages:
  - apps/*
  - packages/*

overrides:
  adm-zip: 0.6.0
  deepmerge-ts: 8.0.2
  sharp: 0.35.4

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': false
  argon2: true
  esbuild: false
  msgpackr-extract: false
  onnxruntime-node: true
  prisma: true
  protobufjs: true
  sharp: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - argon2
  - esbuild
  - prisma
  - '@tailwindcss/oxide'

verifyDepsBeforeRun: false
