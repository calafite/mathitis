packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': false
  esbuild: false
  msgpackr-extract: false
  prisma: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - argon2
  - esbuild
  - prisma
  - '@tailwindcss/oxide'

verifyDepsBeforeRun: false
