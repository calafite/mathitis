services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [api, web]
    networks: [internal, public]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on: [api]
    networks: [internal]

  postgres:
    image: postgres:16-alpine
    env_file: .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass $${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [internal]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file: .env.production
    volumes:
      - minio_data:/data
    networks: [internal]

networks:
  # Private bridge: no external access, no host ports. Only nginx may reach these services.
  internal:
    driver: bridge
    internal: true
  # Edge network: only the reverse proxy sits on it.
  public:
    driver: bridge

volumes:
  postgres_data:
  minio_data: